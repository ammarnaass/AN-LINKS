name: AN LINKS CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: an_links
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/an_links?schema=public
      NEXTAUTH_SECRET: ci-test-secret-key-at-least-32-chars
      NEXTAUTH_URL: http://localhost:3000
      PAYMENT_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Prisma Schema & Generate Client
        run: npx prisma db push && npx prisma generate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Full Test Suite
        run: npx vitest run

      - name: Production Build Verification
        run: npm run build
