<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c12" />
      <stop offset="60%" stop-color="#0e1520" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="meshGlowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGlowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#meshGlowLeft)" />
  <rect width="1200" height="630" fill="url(#meshGlowRight)" />

  <!-- Subtle Matrix/Grid Lines -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Central Brand Emblem -->
  <g transform="translate(140, 160)">
    <!-- Squircle Icon Container -->
    <rect x="0" y="0" width="130" height="130" rx="34" fill="#0d141e" stroke="#1e293b" stroke-width="2.5" />
    <rect x="1.5" y="1.5" width="127" height="127" rx="32.5" fill="none" stroke="url(#primaryGrad)" stroke-opacity="0.4" stroke-width="2" />
    
    <!-- A + N Linked Monogram -->
    <path d="M 36 94 L 54 40 C 56 34, 62 34, 64 40 L 76 74" 
          stroke="url(#primaryGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 60 70 L 73 94 C 75 98, 79 100, 83 96 L 96 42" 
          stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 44 70 L 88 70" 
          stroke="#6ee7b7" stroke-width="7" stroke-linecap="round" />
    <circle cx="54" cy="40" r="5" fill="#ffffff" />
    <circle cx="96" cy="42" r="5" fill="#ffffff" />
    <circle cx="68" cy="70" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(300, 215)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#ffffff">
      AN <tspan fill="#10b981">LINKS</tspan>
    </text>
    <text x="5" y="44" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="700" fill="#a7f3d0">
      المنصة الأكثر تطوراً لروابط البايو وصفحات المبدعين العربية
    </text>
    <text x="5" y="80" font-family="'Cairo', system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      روابط ذكية فائقة السرعة • تخصيص بصري كامل • فحص تلقائي للأعطال • مدفوعات مباشرة
    </text>
  </g>

  <!-- Right Floating Mockup Bento Card -->
  <g transform="translate(800, 120)">
    <rect width="300" height="390" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2" opacity="0.9" />
    <rect x="20" y="24" width="64" height="64" rx="32" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="100" y="32" width="140" height="18" rx="6" fill="#f8fafc" />
    <rect x="100" y="58" width="90" height="12" rx="4" fill="#64748b" />
    <!-- Link Cards inside Mockup -->
    <rect x="20" y="115" width="260" height="52" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="36" y="133" width="16" height="16" rx="4" fill="#10b981" />
    <rect x="64" y="134" width="140" height="14" rx="4" fill="#ffffff" />

    <rect x="20" y="180" width="260" height="52" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="36" y="198" width="16" height="16" rx="4" fill="#38bdf8" />
    <rect x="64" y="199" width="120" height="14" rx="4" fill="#94a3b8" />

    <rect x="20" y="245" width="260" height="52" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="36" y="263" width="16" height="16" rx="4" fill="#a855f7" />
    <rect x="64" y="264" width="150" height="14" rx="4" fill="#94a3b8" />

    <!-- Powered by badge -->
    <text x="95" y="345" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748b">
      ⚡ POWERED BY <tspan fill="#10b981">AN LINKS</tspan>
    </text>
  </g>
</svg>
